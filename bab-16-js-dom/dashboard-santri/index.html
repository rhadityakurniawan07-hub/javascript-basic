<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Santri</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Dashboard Santri</h1>

        <div class="card">
            <h2>Data Santri</h2>

            <p>
                <strong>Nama:</strong>
                <span id="nama"></span>
            </p>

            <p>
                <strong>Kelas:</strong>
                <span id="kelas"></span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="status"></span>
            </p>
        </div>

        <div class="card">
            <h2>Aktivitas Santri</h2>

            <ul id="daftarAktivitas"></ul>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
